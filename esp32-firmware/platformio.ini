; Firmware ESP32 cho mô hình nhà thông minh.
; Pin map và ngưỡng nằm trong include/config.h.

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
; Ứng dụng có Wi-Fi + WebSocket vượt 1,25 MB của phân vùng mặc định; không dùng OTA.
board_build.partitions = huge_app.csv

; Board này nạp lỗi ở 921600 baud, dùng 115200 cho ổn định.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
